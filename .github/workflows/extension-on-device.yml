name: extension-on-device

# Manual only. Public so the job runs on a 4 vCPU / 16 GB runner.
# Downloads the live judge zip; this repo still has no product source.
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: Public URL of the judge zip
        required: false
        default: https://did-i-order-this.vercel.app/downloads/did-i-order-this-extension-0.1.0.zip

permissions:
  contents: read

jobs:
  extension-on-device:
    name: Production extension on-device
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Machine facts
        run: |
          echo "cpus: $(nproc)"; free -h; df -h / /mnt || true
          google-chrome --version

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt || true

      - name: Pick profile volume
        run: |
          if sudo mkdir -p /mnt/nano && sudo chown "$USER" /mnt/nano; then
            echo "PROFILE_DIR=/mnt/nano/profile" >> "$GITHUB_ENV"
          else
            echo "PROFILE_DIR=$RUNNER_TEMP/nano-profile" >> "$GITHUB_ENV"
          fi

      - name: Install ffmpeg and xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Run extension on-device demo
        working-directory: e2e
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url || 'https://did-i-order-this.vercel.app/downloads/did-i-order-this-extension-0.1.0.zip' }}
          PROBE_TIMEOUT_MIN: "15"
        run: bash run-extension-ci.sh

      - name: Summary
        if: always()
        working-directory: e2e
        run: |
          {
            echo '## Extension on-device demo'
            echo '```json'
            node -e "const d=require('./out/result.json'); const pick=x=>({label:x&&x.label,inferenceSource:x&&x.inferenceSource,outcome:x&&x.outcome,headline:x&&x.headline,consentShown:x&&x.consentShown}); console.log(JSON.stringify({chrome:d.version&&d.version.Browser,warmup:d.warmup||null,extensionAvailability:d.extensionAvailability||null,extensionReady:d.extensionReady||null,extension:pick(d.extension),extensionError:d.extensionError||null,fatal:d.fatal||null},null,2))" || echo 'no result.json'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-on-device-out
          path: e2e/out
          retention-days: 90
          if-no-files-found: warn
